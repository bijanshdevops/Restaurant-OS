name: CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: restaurants_os_test
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Run Prisma Migrations (Test DB)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/restaurants_os_test
      - name: Start dev server (with test-only routes enabled)
        run: |
          npm run dev > dev-server.log 2>&1 &
          echo "در حال انتظار برای آماده شدن سرور..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "سرور روی / پاسخ می‌دهد."
              break
            fi
            sleep 2
          done
          if ! curl -sf http://localhost:3000 > /dev/null; then
            echo "سرور در زمان مقرر بالا نیامد. لاگ سرور:"
            cat dev-server.log
            exit 1
          fi
          # گرم کردن مسیر واقعی تست‌ها: در حالت dev، اولین درخواست به هر
          # مسیر (و اولین راه‌اندازی موتور Prisma) می‌تواند چند ثانیه طول
          # بکشد. این کامپایل را همین‌جا انجام می‌دهیم تا مهلت خودِ تست‌ها
          # درگیر آن نشود.
          echo "در حال گرم کردن مسیر /api/test-helpers..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/warmup.json -w "%{http_code}" -X POST http://localhost:3000/api/test-helpers \
              -H "Content-Type: application/json" \
              -d '{"action":"login","args":["admin","123"]}')
            if [ "$code" = "200" ]; then
              echo "مسیر تست‌ها آماده است."
              exit 0
            fi
            sleep 2
          done
          echo "گرم کردن مسیر تست‌ها ناموفق بود (کد آخر: $code). پاسخ آخر:"
          cat /tmp/warmup.json || true
          echo "لاگ سرور:"
          cat dev-server.log
          exit 1
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/restaurants_os_test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENABLE_TEST_ROUTES: '1'
      - name: Run E2E Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/restaurants_os_test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - name: Dump dev server log on failure
        if: failure()
        run: cat dev-server.log || true
