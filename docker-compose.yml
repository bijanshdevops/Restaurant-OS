version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: restaurant_os_db
    restart: always
    ports:
      - "5444:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: restaurant_os
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
